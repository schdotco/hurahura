<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bel Cerdas Cermat - Sistem Remote</title>
    <!-- Library PeerJS untuk komunikasi HP ke PC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1, h2 { color: #2c3e50; }
        
        /* Kontrol Tampilan */
        .view-section { display: none; }
        .active-view { display: block; animation: fadeIn 0.5s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tombol Umum */
        button {
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        
        .btn-primary { background-color: #3498db; color: white; }
        .btn-success { background-color: #2ecc71; color: white; }
        .btn-danger { background-color: #e74c3c; color: white; }
        
        /* Tampilan Server / PC */
        .room-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            margin-bottom: 20px;
        }
        #room-code-display { font-size: 48px; letter-spacing: 5px; color: #e74c3c; margin: 10px 0; }
        
        #host-banner {
            display: none;
            margin: 20px auto;
            padding: 30px;
            border-radius: 12px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            max-width: 800px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Tampilan Client / HP */
        .form-group { margin-bottom: 20px; }
        input, select {
            padding: 15px;
            font-size: 18px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }
        
        #btn-buzz {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            font-size: 30px;
            background-color: #e74c3c;
            color: white;
            box-shadow: 0 10px 20px rgba(231, 76, 60, 0.4);
            border: 8px solid #c0392b;
            margin-top: 30px;
        }
        #btn-buzz:disabled {
            background-color: #95a5a6 !important;
            border-color: #7f8c8d !important;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <!-- File Audio Suara Hewan -->
    <audio id="audio-1" src="suara-kucing.mp3" preload="auto"></audio>
    <audio id="audio-2" src="suara-anjing.mp3" preload="auto"></audio>
    <audio id="audio-3" src="suara-sapi.mp3" preload="auto"></audio>
    <audio id="audio-4" src="suara-kuda.mp3" preload="auto"></audio>
    <audio id="audio-5" src="suara-ayam.mp3" preload="auto"></audio>

    <!-- 1. MENU UTAMA -->
    <div id="view-menu" class="view-section active-view">
        <h1>Sistem Bel Cerdas Cermat</h1>
        <p>Pilih perangkat yang sedang Anda gunakan saat ini:</p>
        <button class="btn-primary" onclick="startHost()">🖥️ Buka sebagai SERVER (Laptop/PC ke Sound System)</button>
        <br><br>
        <button class="btn-success" onclick="showClientSetup()">📱 Buka sebagai PESERTA (HP)</button>
    </div>

    <!-- 2. TAMPILAN SERVER (PC) -->
    <div id="view-host" class="view-section">
        <h2>Layar Utama - Server Bel</h2>
        <div class="room-box">
            <p style="margin:0; color:#7f8c8d;">KODE ROOM:</p>
            <h1 id="room-code-display">...</h1>
            <p style="margin:0;">Tim terhubung: <strong id="client-count">0</strong>/5</p>
        </div>
        
        <div id="host-banner"></div>
        <br><br>
        <button class="btn-danger" style="padding: 20px 50px; font-size: 24px;" onclick="resetHost()">🔄 RESET BEL (Spasi)</button>
    </div>

    <!-- 3. TAMPILAN SETUP PESERTA (HP) -->
    <div id="view-client-setup" class="view-section">
        <h2>Masuk ke Room Lomba</h2>
        <div class="form-group">
            <input type="text" id="room-input" placeholder="Masukkan Kode Room" style="text-transform: uppercase;">
        </div>
        <div class="form-group">
            <select id="team-select">
                <option value="1">Klaster 1 (Kucing)</option>
                <option value="2">Klaster 2 (Anjing)</option>
                <option value="3">Klaster 3 (Sapi)</option>
                <option value="4">Klaster 4 (Kuda)</option>
                <option value="5">Klaster 5 (Ayam)</option>
            </select>
        </div>
        <button id="btn-connect" class="btn-success" onclick="connectClient()">Hubungkan ke Server</button>
    </div>

    <!-- 4. TAMPILAN TOMBOL PESERTA (HP) -->
    <div id="view-buzzer" class="view-section">
        <h2 id="team-name-display">Klaster...</h2>
        <p id="client-status" style="color: #27ae60; font-weight: bold;">✅ Terhubung ke Server</p>
        <button id="btn-buzz" onclick="sendBuzz()">TEKAN!</button>
    </div>

    <script>
        const roomPrefix = 'cerdas-cermat-';
        let myPeer = null;
        
        // Data Konfigurasi
        const klasters = {
            1: { name: "Klaster 1", animal: "Kucing", color: "#ff9f43" },
            2: { name: "Klaster 2", animal: "Anjing", color: "#0abde3" },
            3: { name: "Klaster 3", animal: "Sapi", color: "#10ac84" },
            4: { name: "Klaster 4", animal: "Kuda", color: "#5f27cd" },
            5: { name: "Klaster 5", animal: "Ayam", color: "#ee5253" }
        };

        /* ==========================================
           LOGIKA UNTUK SERVER (PC / LAPTOP)
           ========================================== */
        let connections = [];
        let isLocked = false;

        function startHost() {
            // Generate 4 huruf/angka acak untuk kode room
            const roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
            myPeer = new Peer(roomPrefix + roomCode);

            myPeer.on('open', (id) => {
                switchView('view-host');
                document.getElementById('room-code-display').innerText = roomCode;
            });

            myPeer.on('connection', (conn) => {
                connections.push(conn);
                document.getElementById('client-count').innerText = connections.length;

                conn.on('data', (data) => {
                    if (data.action === 'buzz' && !isLocked) {
                        isLocked = true;
                        playBuzzer(data.team);
                        
                        // Beritahu semua HP siapa yang menang agar tombol mereka mati
                        connections.forEach(c => c.send({ action: 'locked', winner: data.team }));
                    }
                });

                conn.on('close', () => {
                    connections = connections.filter(c => c !== conn);
                    document.getElementById('client-count').innerText = connections.length;
                });
            });

            myPeer.on('error', (err) => {
                alert("Koneksi gagal dibuat. Pastikan internet aktif.");
                console.error(err);
            });
        }

        function playBuzzer(teamId) {
            const team = klasters[teamId];
            
            // Tampilkan Banner di PC
            const banner = document.getElementById('host-banner');
            banner.innerHTML = `🎉 ${team.name} (${team.animal}) Menjawab!`;
            banner.style.backgroundColor = team.color;
            banner.style.display = 'block';

            // Mainkan Suara di PC
            const audio = document.getElementById(`audio-${teamId}`);
            if (audio) {
                audio.currentTime = 0;
                audio.play();
            }
        }

        function resetHost() {
            isLocked = false;
            document.getElementById('host-banner').style.display = 'none';
            
            for (let i = 1; i <= 5; i++) {
                const audio = document.getElementById(`audio-${i}`);
                if (audio) { audio.pause(); audio.currentTime = 0; }
            }

            // Beritahu semua HP agar tombolnya bisa ditekan lagi
            connections.forEach(c => c.send({ action: 'reset' }));
        }

        // Reset menggunakan tombol spasi di PC
        document.addEventListener('keydown', (event) => {
            if ((event.key === ' ' || event.key === 'Enter') && document.getElementById('view-host').classList.contains('active-view')) {
                event.preventDefault();
                resetHost();
            }
        });

        /* ==========================================
           LOGIKA UNTUK CLIENT (HP PESERTA)
           ========================================== */
        let hostConn = null;
        let myTeamId = null;

        function showClientSetup() {
            switchView('view-client-setup');
        }

        function connectClient() {
            const code = document.getElementById('room-input').value.toUpperCase().trim();
            if(!code) return alert("Masukkan kode room!");
            
            myTeamId = document.getElementById('team-select').value;
            const btn = document.getElementById('btn-connect');
            btn.innerText = "Menghubungkan...";
            btn.disabled = true;

            myPeer = new Peer();
            myPeer.on('open', (id) => {
                // Mencoba menyambungkan ke PC Server
                hostConn = myPeer.connect(roomPrefix + code, { reliable: true });
                
                hostConn.on('open', () => {
                    switchView('view-buzzer');
                    const teamName = document.getElementById('team-select').options[document.getElementById('team-select').selectedIndex].text;
                    document.getElementById('team-name-display').innerText = teamName;
                });

                hostConn.on('data', (data) => {
                    const btnBuzz = document.getElementById('btn-buzz');
                    const statusText = document.getElementById('client-status');
                    
                    if (data.action === 'locked') {
                        btnBuzz.disabled = true;
                        if (data.winner == myTeamId) {
                            btnBuzz.innerText = "BERHASIL!";
                            btnBuzz.style.backgroundColor = "#2ecc71"; // Hijau
                            statusText.innerText = "Suara Anda muncul di PC!";
                        } else {
                            btnBuzz.innerText = "KEDULUAN";
                            statusText.innerText = "Tim lain menekan lebih cepat.";
                        }
                    } else if (data.action === 'reset') {
                        btnBuzz.disabled = false;
                        btnBuzz.innerText = "TEKAN!";
                        btnBuzz.style.backgroundColor = "#e74c3c"; // Merah kembali
                        statusText.innerText = "Sistem direset. Siap menjawab!";
                    }
                });

                hostConn.on('close', () => {
                    alert("Koneksi ke PC terputus.");
                    location.reload();
                });
            });

            myPeer.on('error', (err) => {
                alert("Gagal terhubung! Pastikan kode room benar.");
                btn.innerText = "Hubungkan ke Server";
                btn.disabled = false;
            });
        }

        function sendBuzz() {
            if (hostConn && hostConn.open) {
                // Mengirim sinyal ke PC Server
                hostConn.send({ action: 'buzz', team: myTeamId });
            }
        }

        /* Fungsi Bantuan */
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
        }
    </script>
</body>
</html>
